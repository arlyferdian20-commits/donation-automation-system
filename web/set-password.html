<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Atur Password — Donation Automation System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { font-family:"DM Sans",sans-serif; color:#172b3a; background:#f3f6f8; --navy:#102a43; --green:#147d64; --muted:#6b7c8b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(100%,460px); padding:34px; border:1px solid #e1e8ee; border-radius:18px; background:white; box-shadow:0 12px 35px rgba(16,42,67,.07); }
    .eyebrow { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:12px 0 8px; font:800 27px "Plus Jakarta Sans",sans-serif; letter-spacing:-.04em; }
    p { color:var(--muted); font-size:14px; line-height:1.7; }
    label { display:block; margin:18px 0 7px; font-size:13px; font-weight:700; }
    input { width:100%; height:49px; border:1px solid #d5e0e7; border-radius:10px; padding:0 13px; font:500 14px "DM Sans",sans-serif; }
    button { width:100%; height:49px; margin-top:22px; border:0; border-radius:10px; background:var(--navy); color:white; font:700 14px "DM Sans",sans-serif; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .message { display:none; margin-top:16px; padding:12px; border-radius:10px; font-size:13px; line-height:1.6; }
    .error { display:block; color:#9d2c2c; background:#fff1f0; border:1px solid #ffd7d3; }
    .success { display:block; color:#12634f; background:#eaf7f2; border:1px solid #c8e9dc; }
    a { color:var(--green); font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Donation Automation System</div>
    <h1>Buat Password Baru</h1>
    <p>Buat password untuk akun staf Anda. Gunakan password pribadi dan jangan bagikan kepada siapa pun.</p>

    <form id="password-form" hidden>
      <label for="password">Password baru</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter" required>
      <label for="confirm-password">Ulangi password baru</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" placeholder="Ketik ulang password" required>
      <button id="save-button" type="submit">Simpan Password</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite">Memeriksa tautan pemulihan…</div>
    <p id="back-link" hidden><a href="./admin-login.html">Kembali ke halaman login</a></p>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById("password-form");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("save-button");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    async function initialize() {
      // supabase-js detects and exchanges the recovery callback from the URL.
      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) {
        showMessage("Tautan pengaturan password tidak valid atau sudah kedaluwarsa. Kembali ke login dan minta tautan baru.");
        document.getElementById("back-link").hidden = false;
        return;
      }
      form.hidden = false;
      message.className = "message";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage("Password minimal 8 karakter.");
        return;
      }
      if (password !== confirmation) {
        showMessage("Konfirmasi password belum sama.");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Menyimpan…";
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;

        await supabase.auth.signOut();
        form.hidden = true;
        showMessage("Password berhasil dibuat. Silakan login menggunakan email dan password baru.", "success");
        document.getElementById("back-link").hidden = false;
      } catch (error) {
        showMessage(error?.message || "Password gagal disimpan. Minta tautan baru jika tautan sudah kedaluwarsa.");
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Simpan Password";
        document.getElementById("password").value = "";
        document.getElementById("confirm-password").value = "";
      }
    });

    initialize();
  </script>
</body>
</html>
